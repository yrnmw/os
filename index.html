<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>网盘解析工具</title>
    <style>
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --primary-light: #eff6ff;
            --primary-lighter: #dbeafe;
            --primary-border: #bfdbfe;
            --text-primary: #1e293b;
            --text-secondary: #64748b;
            --text-tertiary: #94a3b8;
            --bg-page: #f1f5f9;
            --bg-card: #ffffff;
            --bg-hover: #f8fafc;
            --border: #e2e8f0;
            --border-light: #f1f5f9;
            --success: #16a34a;
            --success-bg: #f0fdf4;
            --radius-sm: 8px;
            --radius-md: 12px;
            --radius-lg: 16px;
            --shadow-sm: 0 1px 2px rgba(15, 23, 42, 0.04);
            --shadow-md: 0 4px 12px rgba(15, 23, 42, 0.06);
            --shadow-lg: 0 8px 24px rgba(15, 23, 42, 0.08);
            --shadow-primary: 0 4px 14px rgba(37, 99, 235, 0.25);
            --transition: 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
            background-color: var(--bg-page);
            color: var(--text-primary);
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
        }

        .app {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* ===== Header ===== */
        .header {
            display: flex;
            align-items: center;
            height: 64px;
            background-color: var(--bg-card);
            box-shadow: var(--shadow-sm);
            position: relative;
            z-index: 10;
        }

        .logo {
            width: 240px;
            display: flex;
            align-items: center;
            padding: 0 24px;
            font-size: 18px;
            font-weight: 700;
            color: var(--text-primary);
        }

        .logo-icon {
            width: 36px;
            height: 36px;
            background: linear-gradient(135deg, var(--primary), #60a5fa);
            border-radius: var(--radius-sm);
            margin-right: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 2px 8px rgba(37, 99, 235, 0.3);
        }

        .header-spacer {
            flex: 1;
        }

        .header-badge {
            padding: 6px 14px;
            background: var(--success-bg);
            color: var(--success);
            font-size: 13px;
            font-weight: 500;
            border-radius: 20px;
            margin-right: 24px;
        }

        /* ===== Main Body ===== */
        .main-body {
            display: flex;
            flex: 1;
        }

        /* ===== Sidebar ===== */
        .sidebar {
            width: 240px;
            background-color: var(--bg-card);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            padding: 16px 12px;
        }

        .nav-section-label {
            font-size: 11px;
            font-weight: 600;
            color: var(--text-tertiary);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            padding: 8px 12px 8px;
        }

        .nav-item {
            display: flex;
            align-items: center;
            padding: 12px 14px;
            margin-bottom: 4px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            color: var(--text-secondary);
            border-radius: var(--radius-sm);
            transition: all var(--transition);
            user-select: none;
            position: relative;
        }

        .nav-item:hover {
            background-color: var(--bg-hover);
            color: var(--text-primary);
        }

        .nav-item.active {
            background-color: var(--primary-light);
            color: var(--primary);
            font-weight: 600;
        }

        .nav-item.active::before {
            content: '';
            position: absolute;
            left: 0;
            top: 50%;
            transform: translateY(-50%);
            width: 3px;
            height: 20px;
            background-color: var(--primary);
            border-radius: 0 3px 3px 0;
        }

        .nav-icon {
            width: 22px;
            height: 22px;
            margin-right: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .nav-icon svg {
            width: 20px;
            height: 20px;
        }

        /* ===== Content ===== */
        .content {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 24px 32px;
            overflow-y: auto;
        }

        .page-title {
            font-size: 22px;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 4px;
        }

        .page-subtitle {
            font-size: 14px;
            color: var(--text-secondary);
            margin-bottom: 24px;
        }

        /* ===== Card ===== */
        .card {
            background-color: var(--bg-card);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-md);
            border: 1px solid var(--border-light);
            overflow: hidden;
        }

        /* ===== Tabs ===== */
        .tabs {
            display: flex;
            gap: 4px;
            padding: 8px;
            background-color: var(--bg-hover);
            border-bottom: 1px solid var(--border);
        }

        .tab {
            padding: 10px 24px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            color: var(--text-secondary);
            border-radius: var(--radius-sm);
            transition: all var(--transition);
            user-select: none;
        }

        .tab:hover {
            color: var(--text-primary);
            background-color: rgba(0, 0, 0, 0.03);
        }

        .tab.active {
            background-color: var(--bg-card);
            color: var(--primary);
            font-weight: 600;
            box-shadow: var(--shadow-sm);
        }

        /* ===== Panel ===== */
        .panel {
            padding: 36px 40px;
            display: none;
        }

        .panel.active {
            display: block;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(4px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .form-group {
            margin-bottom: 24px;
        }

        .form-label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 8px;
        }

        .form-input {
            width: 100%;
            max-width: 560px;
            height: 44px;
            padding: 0 16px;
            border: 1.5px solid var(--border);
            border-radius: var(--radius-sm);
            font-size: 14px;
            color: var(--text-primary);
            outline: none;
            transition: all var(--transition);
            background: var(--bg-card);
        }

        .form-input:hover {
            border-color: var(--primary-border);
        }

        .form-input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }

        .form-input::placeholder {
            color: var(--text-tertiary);
        }

        /* ===== Buttons ===== */
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            height: 44px;
            padding: 0 32px;
            font-size: 15px;
            font-weight: 600;
            border: none;
            border-radius: var(--radius-sm);
            cursor: pointer;
            transition: all var(--transition);
            user-select: none;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary), #3b82f6);
            color: #fff;
            box-shadow: var(--shadow-primary);
        }

        .btn-primary:hover {
            background: linear-gradient(135deg, var(--primary-hover), var(--primary));
            box-shadow: 0 6px 20px rgba(37, 99, 235, 0.35);
            transform: translateY(-1px);
        }

        .btn-primary:active {
            transform: translateY(0);
            box-shadow: var(--shadow-primary);
        }

        .btn svg {
            width: 18px;
            height: 18px;
        }

        .btn-row {
            margin-top: 32px;
        }

        /* ===== BT Panel ===== */
        .disk-section.hidden {
            display: none;
        }

        .bt-panel {
            display: none;
        }

        .bt-panel.active {
            display: block;
            animation: fadeIn 0.3s ease;
        }

        .bt-content {
            padding: 36px 40px;
        }

        /* ===== Result Area ===== */
        .result-area {
            margin-top: 28px;
            padding: 24px;
            background-color: var(--bg-hover);
            border-radius: var(--radius-md);
            border: 1px solid var(--border-light);
            display: none;
        }

        .result-area.show {
            display: block;
            animation: fadeIn 0.3s ease;
        }

        .result-title {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .result-link {
            display: block;
            padding: 12px 16px;
            background-color: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            margin-bottom: 8px;
            word-break: break-all;
            color: var(--primary);
            text-decoration: none;
            font-size: 13px;
            transition: all var(--transition);
        }

        .result-link:hover {
            border-color: var(--primary-border);
            background-color: var(--primary-light);
        }

        .result-meta {
            font-size: 13px;
            color: var(--text-secondary);
            margin-top: 8px;
        }

        .result-meta strong {
            color: var(--text-primary);
        }

        .result-success {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            margin-top: 14px;
            padding: 6px 14px;
            background-color: var(--success-bg);
            color: var(--success);
            font-size: 13px;
            font-weight: 600;
            border-radius: 20px;
        }

        .result-loading {
            font-size: 13px;
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .spinner {
            width: 16px;
            height: 16px;
            border: 2px solid var(--border);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .result-error {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            margin-top: 14px;
            padding: 6px 14px;
            background-color: #fef2f2;
            color: #dc2626;
            font-size: 13px;
            font-weight: 600;
            border-radius: 20px;
        }

        .result-detail {
            margin-top: 10px;
            padding: 12px 16px;
            background-color: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            font-size: 13px;
            color: var(--text-secondary);
            word-break: break-all;
            white-space: pre-wrap;
        }

        /* ===== File List ===== */
        .file-list {
            margin-top: 4px;
        }

        .file-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 16px;
            background-color: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            margin-bottom: 8px;
            transition: all var(--transition);
        }

        .file-item:hover {
            border-color: var(--primary-border);
            box-shadow: 0 2px 8px rgba(37, 99, 235, 0.08);
        }

        .file-info {
            display: flex;
            align-items: center;
            gap: 12px;
            flex: 1;
            min-width: 0;
        }

        .file-icon {
            width: 36px;
            height: 36px;
            background: var(--primary-light);
            border-radius: var(--radius-sm);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--primary);
            flex-shrink: 0;
        }

        .file-icon svg {
            width: 18px;
            height: 18px;
        }

        .file-name {
            font-size: 14px;
            font-weight: 500;
            color: var(--text-primary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .file-id {
            font-size: 12px;
            color: var(--text-tertiary);
            margin-top: 2px;
            font-family: "SFMono-Regular", Consolas, monospace;
        }

        .btn-download {
            height: 34px;
            padding: 0 18px;
            font-size: 13px;
            font-weight: 600;
            border: none;
            border-radius: var(--radius-sm);
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: all var(--transition);
            background: var(--primary-light);
            color: var(--primary);
            flex-shrink: 0;
        }

        .btn-download:hover {
            background: var(--primary);
            color: #fff;
            box-shadow: 0 3px 10px rgba(37, 99, 235, 0.3);
        }

        .btn-download:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .btn-download svg {
            width: 14px;
            height: 14px;
        }

        .file-list-footer {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px dashed var(--border);
        }

        .btn-download-all {
            height: 40px;
            padding: 0 24px;
            font-size: 14px;
            font-weight: 600;
            border: none;
            border-radius: var(--radius-sm);
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: all var(--transition);
            background: linear-gradient(135deg, var(--primary), #3b82f6);
            color: #fff;
            box-shadow: var(--shadow-primary);
        }

        .btn-download-all:hover {
            background: linear-gradient(135deg, var(--primary-hover), var(--primary));
            box-shadow: 0 6px 20px rgba(37, 99, 235, 0.35);
            transform: translateY(-1px);
        }

        .btn-download-all:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .btn-download-all svg {
            width: 16px;
            height: 16px;
        }

        .download-status {
            font-size: 12px;
            color: var(--text-secondary);
            margin-right: auto;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .download-status .spinner {
            width: 12px;
            height: 12px;
            border-width: 1.5px;
        }
    </style>
</head>
<body>
    <div class="app">
        <!-- Header -->
        <header class="header">
            <div class="logo">
                <div class="logo-icon">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M17.5 19a4.5 4.5 0 1 0 0-9h-1.8A7 7 0 1 0 4 14.9"/>
                        <polyline points="12 13 12 22"/>
                        <polyline points="9 16 12 13 15 16"/>
                    </svg>
                </div>
                <span>网盘解析</span>
            </div>
            <div class="header-spacer"></div>
            <div class="header-badge">服务正常</div>
        </header>

        <!-- Main Body -->
        <div class="main-body">
            <!-- Sidebar -->
            <aside class="sidebar">
                <div class="nav-section-label">功能导航</div>
                <div class="nav-item active" data-nav="disk">
                    <span class="nav-icon">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/>
                        </svg>
                    </span>
                    <span>网盘解析</span>
                </div>
                <div class="nav-item" data-nav="bt">
                    <span class="nav-icon">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M14 3l7 7-4 4-7-7z"/>
                            <path d="M3 21l3-1 11-11-2-2L4 18l-1 3z"/>
                            <path d="M13 10l4 4"/>
                        </svg>
                    </span>
                    <span>BT磁力链接</span>
                </div>
            </aside>

            <!-- Content -->
            <main class="content">
                <!-- Disk Section -->
                <div class="disk-section" id="diskSection">
                    <h1 class="page-title">网盘解析</h1>
                    <p class="page-subtitle">支持百度网盘、夸克网盘、123云盘的分享链接解析</p>

                    <div class="card">
                        <div class="tabs">
                            <div class="tab active" data-tab="baidu">
                                <span>百度网盘</span>
                            </div>
                            <div class="tab" data-tab="quark">
                                <span>夸克网盘</span>
                            </div>
                            <div class="tab" data-tab="123">
                                <span>123云盘</span>
                            </div>
                        </div>

                        <!-- Baidu Panel -->
                        <div class="panel active" data-panel="baidu">
                            <div class="form-group">
                                <label class="form-label">分享链接</label>
                                <input type="text" class="form-input" placeholder="请输入百度网盘分享链接，如 https://pan.baidu.com/s/...">
                            </div>
                            <div class="form-group">
                                <label class="form-label">提取码</label>
                                <input type="text" class="form-input" placeholder="请输入提取码（如无可不填）">
                            </div>
                            <div class="btn-row">
                                <button class="btn btn-primary btn-parse">
                                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                                        <circle cx="11" cy="11" r="8"/>
                                        <path d="m21 21-4.3-4.3"/>
                                    </svg>
                                    开始解析
                                </button>
                            </div>
                            <div class="result-area">
                                <div class="result-title">
                                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
                                        <polyline points="14 2 14 8 20 8"/>
                                    </svg>
                                    解析结果
                                </div>
                                <div class="result-content"></div>
                            </div>
                        </div>

                        <!-- Quark Panel -->
                        <div class="panel" data-panel="quark">
                            <div class="form-group">
                                <label class="form-label">分享链接</label>
                                <input type="text" class="form-input" placeholder="请输入夸克网盘分享链接，如 https://pan.quark.cn/s/...">
                            </div>
                            <div class="form-group">
                                <label class="form-label">提取码</label>
                                <input type="text" class="form-input" placeholder="请输入提取码（如无可不填）">
                            </div>
                            <div class="btn-row">
                                <button class="btn btn-primary btn-parse">
                                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                                        <circle cx="11" cy="11" r="8"/>
                                        <path d="m21 21-4.3-4.3"/>
                                    </svg>
                                    开始解析
                                </button>
                            </div>
                            <div class="result-area">
                                <div class="result-title">
                                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
                                        <polyline points="14 2 14 8 20 8"/>
                                    </svg>
                                    解析结果
                                </div>
                                <div class="result-content"></div>
                            </div>
                        </div>

                        <!-- 123 Panel -->
                        <div class="panel" data-panel="123">
                            <div class="form-group">
                                <label class="form-label">分享链接</label>
                                <input type="text" class="form-input" placeholder="请输入123云盘分享链接，如 https://www.123pan.com/s/...">
                            </div>
                            <div class="form-group">
                                <label class="form-label">提取码</label>
                                <input type="text" class="form-input" placeholder="请输入提取码（如无可不填）">
                            </div>
                            <div class="btn-row">
                                <button class="btn btn-primary btn-parse">
                                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                                        <circle cx="11" cy="11" r="8"/>
                                        <path d="m21 21-4.3-4.3"/>
                                    </svg>
                                    开始解析
                                </button>
                            </div>
                            <div class="result-area">
                                <div class="result-title">
                                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
                                        <polyline points="14 2 14 8 20 8"/>
                                    </svg>
                                    解析结果
                                </div>
                                <div class="result-content"></div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- BT Panel -->
                <div class="bt-panel" id="btPanel">
                    <h1 class="page-title">BT磁力链接</h1>
                    <p class="page-subtitle">输入磁力链接或BT种子链接，创建下载任务</p>

                    <div class="card">
                        <div class="bt-content">
                            <div class="form-group">
                                <label class="form-label">磁力链接</label>
                                <input type="text" class="form-input" id="btInput" placeholder="请输入磁力链接，如 magnet:?xt=urn:btih:...">
                            </div>
                            <div class="btn-row">
                                <button class="btn btn-primary" id="btnDownload">
                                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                                        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                                        <polyline points="7 10 12 15 17 10"/>
                                        <line x1="12" y1="15" x2="12" y2="3"/>
                                    </svg>
                                    开始下载
                                </button>
                            </div>
                            <div class="result-area" id="btResult">
                                <div class="result-title">
                                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                                        <polyline points="7 10 12 15 17 10"/>
                                        <line x1="12" y1="15" x2="12" y2="3"/>
                                    </svg>
                                    下载信息
                                </div>
                                <div class="result-content" id="btResultContent"></div>
                            </div>
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <script>
        const API_BASE = 'http://127.0.0.1:5000';

        // 检测是否存在 token cookie，没有则跳转登录页
        (function checkAuth() {
            const cookies = document.cookie.split(';').reduce((acc, item) => {
                const [k, ...v] = item.trim().split('=');
                acc[k] = v.join('=');
                return acc;
            }, {});
            if (!cookies.token) {
                window.location.href = 'login.html';
            }
        })();

        const navItems = document.querySelectorAll('.nav-item');
        const diskSection = document.getElementById('diskSection');
        const btPanel = document.getElementById('btPanel');

        navItems.forEach(item => {
            item.addEventListener('click', () => {
                navItems.forEach(n => n.classList.remove('active'));
                item.classList.add('active');

                const target = item.dataset.nav;
                if (target === 'disk') {
                    diskSection.classList.remove('hidden');
                    btPanel.classList.remove('active');
                } else if (target === 'bt') {
                    diskSection.classList.add('hidden');
                    btPanel.classList.add('active');
                }
            });
        });

        const tabs = document.querySelectorAll('.tab');
        const panels = document.querySelectorAll('.panel');

        tabs.forEach(tab => {
            tab.addEventListener('click', () => {
                const target = tab.dataset.tab;
                tabs.forEach(t => t.classList.remove('active'));
                tab.classList.add('active');
                panels.forEach(p => {
                    p.classList.remove('active');
                    if (p.dataset.panel === target) {
                        p.classList.add('active');
                    }
                });
            });
        });

        function showLoading(contentEl, text) {
            contentEl.innerHTML = `<div class="result-loading"><div class="spinner"></div>${text}</div>`;
        }

        function showSuccess(contentEl, message, details) {
            let html = `<div class="result-success">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
                ${message}
            </div>`;
            if (details) {
                html += `<div class="result-detail">${details}</div>`;
            }
            contentEl.innerHTML = html;
        }

        function showError(contentEl, message) {
            contentEl.innerHTML = `<div class="result-error">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>
                ${message}
            </div>`;
        }

        async function postRequest(endpoint, url, code) {
            const body = { url: url };
            body.code = code && code.trim() ? code.trim() : null;

            const response = await fetch(`${API_BASE}${endpoint}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                credentials: 'include',
                body: JSON.stringify(body)
            });

            const contentType = response.headers.get('content-type') || '';
            let data;
            if (contentType.includes('application/json')) {
                data = await response.json();
            } else {
                data = await response.text();
            }

            if (!response.ok) {
                const errMsg = (data && data.error) ? data.error
                    : (typeof data === 'string' ? data : `请求失败 (HTTP ${response.status})`);
                throw new Error(errMsg);
            }

            return data;
        }

        async function postDownload(fileId) {
            const response = await fetch(`${API_BASE}/down`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                credentials: 'include',
                body: JSON.stringify({ id: fileId })
            });
            const contentType = response.headers.get('content-type') || '';
            let data;
            if (contentType.includes('application/json')) {
                data = await response.json();
            } else {
                data = await response.text();
            }
            if (!response.ok) {
                const errMsg = (data && data.error) ? data.error
                    : (typeof data === 'string' ? data : `请求失败 (HTTP ${response.status})`);
                throw new Error(errMsg);
            }
            return data;
        }

        function getFileIcon() {
            return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
                <polyline points="14 2 14 8 20 8"/>
            </svg>`;
        }

        function getDownloadIcon() {
            return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                <polyline points="7 10 12 15 17 10"/>
                <line x1="12" y1="15" x2="12" y2="3"/>
            </svg>`;
        }

        function renderFileList(contentEl, files) {
            const entries = Object.entries(files);
            let html = '<div class="file-list">';
            entries.forEach(([fileName, fileId]) => {
                html += `
                    <div class="file-item" data-id="${fileId}">
                        <div class="file-info">
                            <div class="file-icon">${getFileIcon()}</div>
                            <div>
                                <div class="file-name" title="${fileName}">${fileName}</div>
                                <div class="file-id">ID: ${fileId}</div>
                            </div>
                        </div>
                        <button class="btn-download" data-id="${fileId}">
                            ${getDownloadIcon()}
                            下载
                        </button>
                    </div>
                `;
            });
            html += `</div>
                <div class="file-list-footer">
                    <span class="download-status"></span>
                    <button class="btn-download-all" id="btnDownloadAll">
                        ${getDownloadIcon()}
                        一键下载
                    </button>
                </div>`;
            contentEl.innerHTML = html;

            // 绑定单个下载按钮事件
            contentEl.querySelectorAll('.btn-download').forEach(btn => {
                btn.addEventListener('click', async () => {
                    const fileId = btn.dataset.id;
                    btn.disabled = true;
                    const originalHTML = btn.innerHTML;
                    btn.innerHTML = '<div class="spinner"></div>下载中...';
                    try {
                        await postDownload(fileId);
                        btn.innerHTML = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>已下载';
                        btn.style.background = 'var(--success-bg)';
                        btn.style.color = 'var(--success)';
                    } catch (err) {
                        btn.innerHTML = originalHTML;
                        btn.disabled = false;
                        alert(`下载失败：${err.message}`);
                    }
                });
            });

            // 绑定一键下载按钮事件
            const btnDownloadAll = contentEl.querySelector('#btnDownloadAll');
            const statusEl = contentEl.querySelector('.download-status');
            btnDownloadAll.addEventListener('click', async () => {
                btnDownloadAll.disabled = true;
                const allBtns = contentEl.querySelectorAll('.btn-download');
                allBtns.forEach(b => b.disabled = true);

                let successCount = 0;
                let failCount = 0;

                for (let i = 0; i < entries.length; i++) {
                    const [fileName, fileId] = entries[i];
                    statusEl.innerHTML = `<div class="spinner"></div>正在下载 (${i + 1}/${entries.length})：${fileName}`;
                    try {
                        await postDownload(fileId);
                        successCount++;
                        const itemBtn = contentEl.querySelector(`.btn-download[data-id="${fileId}"]`);
                        if (itemBtn) {
                            itemBtn.innerHTML = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>已下载';
                            itemBtn.style.background = 'var(--success-bg)';
                            itemBtn.style.color = 'var(--success)';
                        }
                    } catch (err) {
                        failCount++;
                    }
                }

                if (failCount === 0) {
                    statusEl.innerHTML = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="var(--success)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>全部下载完成（${successCount} 个文件）`;
                } else {
                    statusEl.innerHTML = `完成：成功 ${successCount} 个，失败 ${failCount} 个`;
                }
                btnDownloadAll.disabled = false;
            });
        }

        function formatResponse(data) {
            if (typeof data === 'string') return data;
            if (data && typeof data === 'object') {
                if (data.download_url) return data.download_url;
                if (data.url) return data.url;
                if (data.result) return typeof data.result === 'string' ? data.result : JSON.stringify(data.result, null, 2);
                if (data.message) return data.message;
                return JSON.stringify(data, null, 2);
            }
            return String(data);
        }

        // Parse buttons (Baidu / Quark / 123)
        const parseButtons = document.querySelectorAll('.btn-parse');
        parseButtons.forEach(btn => {
            btn.addEventListener('click', async () => {
                const panel = btn.closest('.panel');
                const inputs = panel.querySelectorAll('.form-input');
                const link = inputs[0].value.trim();
                const password = inputs[1].value.trim();
                const resultArea = panel.querySelector('.result-area');
                const resultContent = panel.querySelector('.result-content');

                if (!link) {
                    shakeInput(inputs[0]);
                    return;
                }

                const activeTab = document.querySelector('.tab.active');
                const tabType = activeTab.dataset.tab;
                const endpointMap = { baidu: '/baidu', quark: '/kuake', '123': '/123pan' };
                const endpoint = endpointMap[tabType] || '/baidu';

                resultArea.classList.add('show');
                showLoading(resultContent, '正在解析中，请稍候...');
                btn.disabled = true;
                btn.style.opacity = '0.7';

                try {
                    const data = await postRequest(endpoint, link, password);
                    if (data && data.files !== undefined) {
                        if (typeof data.files === 'object' && data.files !== null) {
                            renderFileList(resultContent, data.files);
                            const successBadge = document.createElement('div');
                            successBadge.className = 'result-success';
                            successBadge.style.marginTop = '14px';
                            successBadge.innerHTML = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>解析成功，共找到 ' + Object.keys(data.files).length + ' 个文件';
                            resultContent.prepend(successBadge);
                        } else if (data.files === 'error') {
                            showError(resultContent, '解析失败，请检查链接和密码是否正确');
                        } else if (data.files === 'keyerror') {
                            alert('登陆过期');
                            window.location.href = 'login.html';
                        } else if (data.files === 'nospace') {
                            showError(resultContent, '今日解析次数到达上限，请明天再来');
                        } else {
                            showSuccess(resultContent, '解析成功', formatResponse(data));
                        }
                    } else if (data && data.download_url) {
                        resultContent.innerHTML = `
                            <a href="${data.download_url}" target="_blank" class="result-link">${data.download_url}</a>
                            ${password ? `<div class="result-meta">提取码：<strong>${password}</strong></div>` : ''}
                            <div class="result-success">
                                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
                                解析成功
                            </div>
                        `;
                    } else {
                        showSuccess(resultContent, '解析成功', formatResponse(data));
                    }
                } catch (err) {
                    showError(resultContent, `解析失败：${err.message}`);
                } finally {
                    btn.disabled = false;
                    btn.style.opacity = '';
                }
            });
        });

        // BT Download button
        const btnDownload = document.getElementById('btnDownload');
        const btInput = document.getElementById('btInput');
        const btResult = document.getElementById('btResult');
        const btResultContent = document.getElementById('btResultContent');

        btnDownload.addEventListener('click', async () => {
            const link = btInput.value.trim();

            if (!link) {
                shakeInput(btInput);
                return;
            }

            btResult.classList.add('show');
            showLoading(btResultContent, '正在解析磁力链接...');
            btnDownload.disabled = true;
            btnDownload.style.opacity = '0.7';

            try {
                const data = await postRequest('/bt', link, null);
                const detail = formatResponse(data);
                showSuccess(btResultContent, '下载任务已创建', detail);
            } catch (err) {
                showError(btResultContent, `下载失败：${err.message}`);
            } finally {
                btnDownload.disabled = false;
                btnDownload.style.opacity = '';
            }
        });

        function shakeInput(input) {
            input.style.borderColor = '#ef4444';
            input.style.boxShadow = '0 0 0 3px rgba(239, 68, 68, 0.1)';
            input.focus();
            setTimeout(() => {
                input.style.borderColor = '';
                input.style.boxShadow = '';
            }, 1500);
        }
    </script>
</body>
</html>
